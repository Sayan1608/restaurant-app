spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=restaurant-ordering-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/restaurant_app}
spring.datasource.username=${DATABASE_USERNAME:restaurant_app}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

app.security.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:noreply@restaurant.local}
# SMTP is optional for local runs; mail transport availability is not app/database readiness.
management.health.mail.enabled=false
